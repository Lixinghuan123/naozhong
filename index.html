<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能闹钟</title>
    
    <!-- 引入外部资源 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- 自定义样式 -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- 页面标题 -->
        <header class="header">
            <div class="header-content">
                <i class="fas fa-clock header-icon"></i>
                <h1 class="header-title">智能闹钟</h1>
            </div>
            <p class="header-subtitle">管理您的时间，享受高效生活</p>
        </header>

        <!-- 主页面内容 -->
        <main class="main-content">
            <!-- 添加闹钟按钮 -->
            <div class="add-alarm-section">
                <button id="addAlarmBtn" class="btn btn-primary">
                    <i class="fas fa-plus"></i>
                    添加闹钟
                </button>
            </div>

            <!-- 闹钟列表 -->
            <div id="alarmList" class="alarm-list">
                <!-- 闹钟项将通过JavaScript动态生成 -->
            </div>

            <!-- 空状态提示 -->
            <div id="emptyState" class="empty-state">
                <i class="fas fa-bell-slash empty-state-icon"></i>
                <h3 class="empty-state-title">暂无闹钟</h3>
                <p class="empty-state-text">点击"添加闹钟"按钮设置您的第一个闹钟</p>
            </div>
        </main>
    </div>

    <!-- 添加/编辑闹钟弹窗 -->
    <div id="alarmModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">添加闹钟</h2>
                <button id="closeModalBtn" class="btn-close">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="alarmForm" class="alarm-form">
                <!-- 闹钟标题 -->
                <div class="form-group">
                    <label for="alarmTitle" class="form-label">闹钟标题</label>
                    <input type="text" id="alarmTitle" class="form-input" placeholder="例如：起床闹钟" required>
                </div>

                <!-- 闹钟时间 -->
                <div class="form-group">
                    <label for="alarmTime" class="form-label">闹钟时间</label>
                    <input type="time" id="alarmTime" class="form-input" required>
                </div>

                <!-- 重复设置 -->
                <div class="form-section">
                    <h3 class="form-section-title">重复设置</h3>
                    
                    <!-- 重复类型选择 -->
                    <div class="form-group">
                        <label class="form-label">重复类型</label>
                        <div class="checkbox-group">
                            <label class="checkbox-option">
                                <input type="checkbox" id="repeatDaily" value="daily">
                                <span class="checkbox-text">每天</span>
                            </label>
                            <label class="checkbox-option">
                                <input type="checkbox" id="repeatInterval" value="interval">
                                <span class="checkbox-text">间隔</span>
                            </label>
                            <label class="checkbox-option">
                                <input type="checkbox" id="repeatSpecific" value="specific">
                                <span class="checkbox-text">特定日期</span>
                            </label>
                        </div>
                    </div>

                    <!-- 间隔设置 (仅当选择间隔时显示) -->
                    <div id="intervalSettings" class="form-group hidden">
                        <label class="form-label">重复间隔</label>
                        <div class="interval-input-group">
                            <input type="number" id="intervalValue" class="form-input" min="1" value="1">
                            <select id="intervalUnit" class="form-select">
                                <option value="minutes">分钟</option>
                                <option value="hours">小时</option>
                            </select>
                        </div>
                    </div>

                    <!-- 特定日期选择 (仅当选择特定日期时显示) -->
                    <div id="specificDateSettings" class="form-group hidden">
                        <label class="form-label">选择日期</label>
                        <div id="datePicker" class="date-picker">
                            <!-- 日期选择器将通过JavaScript动态生成 -->
                        </div>
                        <div id="selectedDates" class="selected-dates"></div>
                    </div>
                </div>

                <!-- 响铃设置 -->
                <div class="form-section">
                    <h3 class="form-section-title">响铃设置</h3>
                    
                    <!-- 音乐选择 -->
                    <div class="form-group">
                        <label for="alarmSound" class="form-label">响铃音乐</label>
                        <select id="alarmSound" class="form-select">
                            <option value="default">默认铃声</option>
                            <option value="birds">鸟鸣声</option>
                            <option value="digital">电子声</option>
                            <option value="piano">钢琴声</option>
                        </select>
                    </div>

                    <!-- 语音播报 -->
                    <div class="form-group">
                        <label class="checkbox-option">
                            <input type="checkbox" id="enableVoice" checked>
                            <span class="checkbox-text">启用语音播报闹钟标题</span>
                        </label>
                    </div>
                </div>

                <!-- 表单操作按钮 -->
                <div class="form-actions">
                    <button type="button" id="cancelBtn" class="btn btn-secondary">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <i class="fas fa-save"></i>
                        保存
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- 闹钟响铃弹窗 -->
    <div id="ringingModal" class="modal modal-ringing">
        <div class="modal-content modal-content-ringing">
            <div class="ringing-header">
                <h2 id="ringingTitle" class="ringing-title">闹钟响了！</h2>
                <button id="snoozeBtn" class="btn btn-secondary">
                    <i class="fas fa-clock"></i>
                    稍后提醒
                </button>
            </div>

            <div class="ringing-body">
                <div id="ringingAlarmTitle" class="ringing-alarm-title"></div>
                <div id="ringingTime" class="ringing-time"></div>
            </div>

            <div class="ringing-actions">
                <button id="stopRingingBtn" class="btn btn-danger btn-large">
                    <i class="fas fa-stop"></i>
                    停止响铃
                </button>
            </div>
        </div>
    </div>

    <!-- 引入JavaScript -->
    <script src="script.js"></script>
</body>
</html>
