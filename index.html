<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web闹钟应用</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="fas fa-clock"></i> Web闹钟</h1>
            <p class="current-time" id="currentTime"></p>
        </header>

        <main>
            <div class="alarm-list-header">
                <h2>我的闹钟</h2>
                <button class="btn btn-primary" id="addAlarmBtn">
                    <i class="fas fa-plus"></i> 添加闹钟
                </button>
            </div>

            <div class="alarm-list" id="alarmList">
                <!-- 闹钟列表将动态生成 -->
            </div>

            <div class="empty-state" id="emptyState" style="display: none;">
                <i class="fas fa-bell-slash"></i>
                <h3>暂无闹钟</h3>
                <p>点击上方按钮添加您的第一个闹钟</p>
            </div>
        </main>
    </div>

    <!-- 添加闹钟弹窗 -->
    <div class="modal" id="addAlarmModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-plus-circle"></i> 添加闹钟</h2>
                <button class="close-btn" id="closeAddModal">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="addAlarmForm">
                <div class="form-group">
                    <label for="alarmTitle">闹钟标题</label>
                    <input type="text" id="alarmTitle" placeholder="例如：起床闹钟" required>
                </div>

                <div class="form-group">
                    <label for="alarmTime">响铃时间</label>
                    <input type="time" id="alarmTime" required>
                </div>

                <div class="form-group">
                    <label>重复设置</label>
                    <div class="repeat-options">
                        <label class="radio-label">
                            <input type="radio" name="repeatType" value="none" checked>
                            <span>仅一次</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="repeatType" value="daily">
                            <span>每天</span>
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="repeatType" value="interval">
                            <span>间隔重复</span>
                        </label>
                    </div>
                </div>

                <div class="form-group" id="intervalGroup" style="display: none;">
                    <label>间隔时间</label>
                    <div class="interval-inputs">
                        <input type="number" id="intervalValue" min="1" value="30" placeholder="间隔值">
                        <select id="intervalUnit">
                            <option value="minutes">分钟</option>
                            <option value="hours">小时</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="datesGroup">
                    <label>响铃日期（可多选）</label>
                    <div class="date-grid" id="dateGrid">
                        <!-- 日期选择器将动态生成 -->
                    </div>
                </div>

                <div class="form-group">
                    <label>响铃方式</label>
                    <div class="notification-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="playSound" checked>
                            <span><i class="fas fa-volume-up"></i> 播放音乐</span>
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" id="voiceAnnounce" checked>
                            <span><i class="fas fa-microphone"></i> 语音播报</span>
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn btn-secondary" id="cancelAddBtn">取消</button>
                    <button type="submit" class="btn btn-primary">保存闹钟</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 响铃弹窗 -->
    <div class="modal alarm-ringing" id="alarmRingingModal">
        <div class="modal-content alarm-content">
            <div class="alarm-icon">
                <i class="fas fa-bell"></i>
            </div>
            <h2 class="alarm-title" id="ringingTitle">闹钟响了！</h2>
            <p class="alarm-time-display" id="ringingTime"></p>
            <div class="alarm-actions">
                <button class="btn btn-primary" id="snoozeBtn">
                    <i class="fas fa-snooze"></i> 稍后提醒（5分钟）
                </button>
                <button class="btn btn-secondary" id="dismissBtn">
                    <i class="fas fa-stop"></i> 关闭闹钟
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
